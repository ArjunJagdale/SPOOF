<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Spoof Live</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    text-align: center;
    font-family: Arial;
    overflow-x: hidden;
  }
  h2 {
    font-size: 30px;
    margin: 16px 0 6px;
  }
  .instructions {
    font-size: 15px;
    color: #444;
    max-width: 360px;
    margin: 8px auto 16px;
    line-height: 1.4;
    padding: 0 12px;
  }
  .video-wrapper {
    position: relative;
    width: min(400px, calc(100vw - 24px));
    height: min(400px, calc(100vw - 24px));
    margin: 0 auto;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .video-wrapper::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(
        ellipse 35% 55% at center,
        transparent 0%,
        transparent 90%,
        rgba(0, 0, 0, 0.80) 91%
      );
  }

  /* ── Distance badge ── */
  #distanceBadge {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.4px;
    transition: background 0.3s, color 0.3s;
    background: #e8e8e8;
    color: #333;
  }
  #distanceBadge.close { background: #ffe0e0; color: #c0392b; }
  #distanceBadge.good  { background: #d4f7dc; color: #1a7a37; }
  #distanceBadge.far   { background: #fff3cd; color: #856404; }
</style>
</head>
<body>
<h2>Live Anti-Spoof</h2>
<p class="instructions">
  • Ensure your face is clearly visible in good lighting (avoid harsh reflections).<br>
  • Align and fit your face tightly within the oval.
</p>
<div class="video-wrapper">
  <video id="video" autoplay playsinline></video>
</div>
<canvas id="canvas" width="224" height="224" style="display:none;"></canvas>
<p id="result" style="margin-top:12px;">Loading model...</p>
<div id="distanceBadge">📏 Distance: —</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  DISTANCE ESTIMATION — pure pixel math, zero external libraries
//
//  We reuse the exact same 224×224 imageData already drawn for the spoof model.
//  Steps:
//    1. Scan every pixel for skin tone (works across light/dark skin via YCbCr)
//    2. Find the leftmost & rightmost skin-pixel X columns → face width in px
//    3. Apply pinhole camera formula:
//         distance (cm) = (KNOWN_FACE_WIDTH_CM × FOCAL_PX) / face_px_width
//
//  Focal length is calibrated for the 224×224 canvas:
//    At 60 cm a typical face fills ~60% of the 224px canvas → ~134 px wide
//    focal = 134 × 60 / 14 ≈ 574
//  ⚙️  Tweak FOCAL_PX below if readings feel off on your device.
// ─────────────────────────────────────────────────────────────────────────────
const KNOWN_FACE_WIDTH_CM = 14;  // average adult inter-cheek width
const FOCAL_PX            = 574; // calibrated for 224px canvas, ~60 cm ref dist

// Tight-oval target range in cm — adjust to match your oval
const GOOD_MIN_CM = 25;
const GOOD_MAX_CM = 38;

// Minimum skin pixels needed to trust the reading (filters out stray noise)
const MIN_SKIN_PIXELS = 300;

/**
 * isSkin(r, g, b)
 * Converts RGB → YCbCr and checks the classic skin-tone band.
 * Works reasonably well across a wide range of skin colours.
 */
function isSkin(r, g, b) {
  // RGB → YCbCr (BT.601)
  const Y  =  0.299  * r + 0.587  * g + 0.114  * b;
  const Cb = -0.1687 * r - 0.3313 * g + 0.5    * b + 128;
  const Cr =  0.5    * r - 0.4187 * g - 0.0813 * b + 128;
  return (
    Y  >  80 &&
    Cb >= 85  && Cb <= 135 &&
    Cr >= 135 && Cr <= 180
  );
}

/**
 * estimateFaceWidthPx(imageData)
 * Scans the 224×224 RGBA pixel array.
 * Returns the horizontal span (px) of the largest contiguous skin-column band,
 * or null if not enough skin pixels were found.
 */
function estimateFaceWidthPx(imageData) {
  let minX = 224, maxX = 0;
  let skinCount = 0;

  // Only scan the centre vertical strip (rows 30–190) to ignore neck/background
  const ROW_START = 30, ROW_END = 190;

  for (let y = ROW_START; y < ROW_END; y++) {
    for (let x = 0; x < 224; x++) {
      const idx = (y * 224 + x) * 4;
      const r = imageData[idx];
      const g = imageData[idx + 1];
      const b = imageData[idx + 2];
      if (isSkin(r, g, b)) {
        skinCount++;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
      }
    }
  }

  if (skinCount < MIN_SKIN_PIXELS || maxX <= minX) return null;
  return maxX - minX;
}

/**
 * updateDistanceBadge(faceWidthPx)
 * Computes distance from pixel width and updates the UI badge.
 */
function updateDistanceBadge(faceWidthPx) {
  const badge = document.getElementById("distanceBadge");
  if (!faceWidthPx) {
    badge.className = "";
    badge.textContent = "📏 Distance: — (no face detected)";
    return;
  }
  const distanceCm = (KNOWN_FACE_WIDTH_CM * FOCAL_PX) / faceWidthPx;
  const d = Math.round(distanceCm);
  if (d < GOOD_MIN_CM) {
    badge.className = "close";
    badge.textContent = `📏 ${d} cm — Too close, move back`;
  } else if (d > GOOD_MAX_CM) {
    badge.className = "far";
    badge.textContent = `📏 ${d} cm — Too far, move closer`;
  } else {
    badge.className = "good";
    badge.textContent = `📏 ${d} cm — ✓ Perfect distance`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  ORIGINAL CODE — untouched below this line
// ─────────────────────────────────────────────────────────────────────────────
let session;
let currentFacingMode = "user";
let isFrontCamera = true;
let currentStream = null;

async function init() {
  session = await ort.InferenceSession.create("spoofnet.onnx");
  document.getElementById("result").innerText = "Model loaded. Starting camera...";
  startCamera(currentFacingMode);
}

async function startCamera(facingMode) {
  const video = document.getElementById("video");
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode }
  });
  currentStream = stream;
  video.srcObject = stream;
  currentFacingMode = facingMode;
  isFrontCamera = facingMode === "user";
  video.style.transform = isFrontCamera ? "scaleX(-1)" : "scaleX(1)";
  runLoop();
}

document.addEventListener("dblclick", () => {
  const newMode = currentFacingMode === "user" ? "environment" : "user";
  startCamera(newMode);
});

async function runLoop() {
  const video  = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx    = canvas.getContext("2d");

  ctx.save();
  if (isFrontCamera) {
    ctx.scale(-1, 1);
    ctx.drawImage(video, -224, 0, 224, 224);
  } else {
    ctx.drawImage(video, 0, 0, 224, 224);
  }
  ctx.restore();

  const imageData = ctx.getImageData(0, 0, 224, 224).data;

  // ── Distance estimation — reuses imageData already read for spoof model ──
  const faceWidthPx = estimateFaceWidthPx(imageData);
  updateDistanceBadge(faceWidthPx);

  const floatData = new Float32Array(1 * 3 * 224 * 224);
  const mean = [0.485, 0.456, 0.406];
  const std  = [0.229, 0.224, 0.225];
  for (let i = 0; i < 224 * 224; i++) {
    const r = imageData[i * 4]     / 255;
    const g = imageData[i * 4 + 1] / 255;
    const b = imageData[i * 4 + 2] / 255;
    floatData[i]             = (r - mean[0]) / std[0];
    floatData[i + 224*224]   = (g - mean[1]) / std[1];
    floatData[i + 2*224*224] = (b - mean[2]) / std[2];
  }

  const tensor  = new ort.Tensor("float32", floatData, [1, 3, 224, 224]);
  const results = await session.run({ input: tensor });
  const logit   = results.output.data[0];
  const prob    = 1 / (1 + Math.exp(-logit));

  document.getElementById("result").innerText =
    prob > 0.5 ? `REAL (${prob.toFixed(3)})`
               : `ATTACK (${prob.toFixed(3)})`;

  requestAnimationFrame(runLoop);
}

init();
</script>
</body>
</html>
