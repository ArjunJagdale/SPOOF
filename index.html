<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Spoof Live</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      text-align: center;
      font-family: Arial;
      overflow-x: hidden;
      background: #fff;
    }

    h2 {
      font-size: 26px;
      margin: 16px 0 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    /* ── Video wrapper — portrait oval ── */
    .video-wrapper {
      position: relative;
      width: min(300px, calc(100vw - 24px));
      height: min(380px, calc((100vw - 24px) * 1.27));
      margin: 0 auto;
      overflow: hidden;
      border-radius: 50%;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dark vignette */
    .video-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 42% 48% at center,
        transparent 0%,
        transparent 86%,
        rgba(0,0,0,0.78) 87%
      );
      border-radius: 50%;
    }

    /* ── Progress ring — sized to match wrapper exactly ── */
    .ring-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #progressRing {
      width: 100%;
      height: 100%;
      /* viewBox matches wrapper aspect: 300 wide × 380 tall */
    }

    #ringTrack {
      fill: none;
      stroke: rgba(255,255,255,0.15);
      stroke-width: 5;
    }

    #ringFill {
      fill: none;
      stroke: #39ff14;
      stroke-width: 5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px #39ff14);
      stroke-dasharray: 0 10000;
      transition: stroke-dasharray 0.1s linear;
    }

    /* ── Status label ── */
    #status {
      margin: 14px auto 0;
      font-size: 15px;
      color: #333;
      min-height: 44px;
      max-width: 300px;
      line-height: 1.5;
      white-space: pre-line;
    }

    /* ── Result box ── */
    #resultBox {
      display: none;
      margin: 16px auto;
      width: min(300px, calc(100vw - 24px));
      padding: 16px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    #resultBox.real   { background: #dcfce7; color: #15803d; border: 2px solid #86efac; }
    #resultBox.attack { background: #fee2e2; color: #b91c1c; border: 2px solid #fca5a5; }

    /* ── Retry button ── */
    #retryBtn {
      display: none;
      margin: 10px auto 24px;
      padding: 10px 28px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
    }

    #retryBtn:hover { background: #2563eb; }
  </style>
</head>
<body>

<h2>Face Liveness Check</h2>
<p class="subtitle">Make sure you are in a well-lit area</p>

<div class="video-wrapper" id="videoWrapper">
  <video id="video" autoplay playsinline></video>
  <div class="ring-wrap">
    <!--
      viewBox: 300 × 380 to match wrapper aspect ratio.
      Ellipse: cx=150, cy=190 (centre), rx=143, ry=183 (near edges with 7px padding for stroke).
      Circumference of ellipse ≈ π × (3(rx+ry) − √((3rx+ry)(rx+3ry)))
      = π × (3×326 − √((3×143+183)(143+3×183)))
      = π × (978 − √(612×732))
      = π × (978 − √447984)
      = π × (978 − 669.3)
      = π × 308.7 ≈ 969.5
      We set this in JS so the dasharray maths is exact.
    -->
    <svg id="progressRing" viewBox="0 0 300 380">
      <ellipse id="ringTrack" cx="150" cy="190" rx="143" ry="183"/>
      <ellipse id="ringFill"  cx="150" cy="190" rx="143" ry="183"/>
    </svg>
  </div>
</div>

<p id="status">Loading models...</p>
<div id="resultBox"></div>
<button id="retryBtn" onclick="retry()">Try Again</button>

<canvas id="canvas" width="224" height="224" style="display:none;"></canvas>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const WEIGHTS_URL      = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";
  const DETECTOR_OPTIONS = new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5 });
  const HOLD_DURATION_MS = 1500;
  const CAPTURE_FRAMES   = 15;
  const OVAL_IOU_THRESH  = 0.42;
  const MEAN = [0.485, 0.456, 0.406];
  const STD  = [0.229, 0.224, 0.225];

  // Oval bounding rect as fractions (narrower horizontally)
  const OVAL = { x1: 0.25, y1: 0.0, x2: 0.75, y2: 1.0 };

  // ── Ellipse circumference (Ramanujan approximation) ───────────────────────
  // rx=143, ry=183
  const RX = 143, RY = 183;
  const h  = Math.pow((RX - RY) / (RX + RY), 2);
  const CIRCUMFERENCE = Math.PI * (RX + RY) * (1 + (3 * h) / (10 + Math.sqrt(4 - 3 * h)));

  // ── State ─────────────────────────────────────────────────────────────────
  let session, currentStream;
  let isFrontCamera     = true;
  let currentFacingMode = "user";
  let alignStart        = null;
  let phase             = "aligning";

  // ── Ring helpers ──────────────────────────────────────────────────────────
  const ringFill = document.getElementById("ringFill");

  // Rotate start point to top of ellipse
  // SVG ellipse starts drawing from rightmost point — offset by -90deg via transform
  ringFill.style.transformOrigin = "150px 190px";
  ringFill.style.transform       = "rotate(-90deg)";
  document.getElementById("ringTrack").style.transformOrigin = "150px 190px";
  document.getElementById("ringTrack").style.transform       = "rotate(-90deg)";

  function setRing(fraction) {
    const filled = fraction * CIRCUMFERENCE;
    ringFill.style.strokeDasharray = `${filled} ${CIRCUMFERENCE + 10}`;
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  async function init() {
    setStatus("Loading models...");
    await Promise.all([
      ort.InferenceSession.create("spoofnet.onnx").then(s => { session = s; }),
      faceapi.nets.tinyFaceDetector.loadFromUri(WEIGHTS_URL)
    ]);
    setStatus("Starting camera...");
    await startCamera("user");
  }

  async function startCamera(facingMode) {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
    const video  = document.getElementById("video");
    currentStream     = stream;
    video.srcObject   = stream;
    currentFacingMode = facingMode;
    isFrontCamera     = facingMode === "user";
    video.style.transform = isFrontCamera ? "scaleX(-1)" : "scaleX(1)";
    phase      = "aligning";
    alignStart = null;
    setRing(0);
    setStatus("Position your face inside the oval");
    requestAnimationFrame(alignLoop);
  }

  document.addEventListener("dblclick", () => {
    if (phase === "done") return;
    startCamera(currentFacingMode === "user" ? "environment" : "user");
  });

  // ── IoU ───────────────────────────────────────────────────────────────────
  function computeIoU(box, vw, vh) {
    const fx1 = box.x / vw,               fy1 = box.y / vh;
    const fx2 = (box.x + box.width) / vw, fy2 = (box.y + box.height) / vh;
    const ix1 = Math.max(fx1, OVAL.x1),   iy1 = Math.max(fy1, OVAL.y1);
    const ix2 = Math.min(fx2, OVAL.x2),   iy2 = Math.min(fy2, OVAL.y2);
    const iw  = Math.max(0, ix2 - ix1),   ih  = Math.max(0, iy2 - iy1);
    const inter = iw * ih;
    const union = (fx2-fx1)*(fy2-fy1) + (OVAL.x2-OVAL.x1)*(OVAL.y2-OVAL.y1) - inter;
    return union > 0 ? inter / union : 0;
  }

  // ── Alignment loop ────────────────────────────────────────────────────────
  async function alignLoop() {
    if (phase !== "aligning") return;

    const video = document.getElementById("video");
    let aligned = false, iou = 0;

    if (video.readyState >= 2) {
      const det = await faceapi.detectSingleFace(video, DETECTOR_OPTIONS);
      if (det) {
        const vw = video.videoWidth  || video.clientWidth;
        const vh = video.videoHeight || video.clientHeight;
        iou     = computeIoU(det.box, vw, vh);
        aligned = iou >= OVAL_IOU_THRESH;
      }
    }

    const now = performance.now();

    if (aligned) {
      if (!alignStart) alignStart = now;
      const elapsed  = now - alignStart;
      const fraction = Math.min(elapsed / HOLD_DURATION_MS, 1.0);
      setRing(fraction);
      setStatus("Hold still...");

      if (elapsed >= HOLD_DURATION_MS) {
        phase = "capturing";
        setRing(1);
        setStatus("Analysing...");
        await capture();
        return;
      }
    } else {
      alignStart = null;
      setRing(0);

      if (iou === 0) {
        setStatus("No face detected.\nLook directly at the camera.");
      } else if (iou < 0.20) {
        setStatus("Come closer and fill the oval\nwith your face.");
      } else {
        setStatus("Almost there — move a little closer\nand centre your face.");
      }
    }

    requestAnimationFrame(alignLoop);
  }

  // ── Capture ───────────────────────────────────────────────────────────────
  async function capture() {
    const video  = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx    = canvas.getContext("2d");
    const logits = [];

    for (let i = 0; i < CAPTURE_FRAMES; i++) {
      ctx.save();
      if (isFrontCamera) {
        ctx.scale(-1, 1);
        ctx.drawImage(video, -224, 0, 224, 224);
      } else {
        ctx.drawImage(video, 0, 0, 224, 224);
      }
      ctx.restore();

      const imageData = ctx.getImageData(0, 0, 224, 224).data;
      const floatData = new Float32Array(3 * 224 * 224);
      for (let p = 0; p < 224 * 224; p++) {
        const r = imageData[p * 4]     / 255;
        const g = imageData[p * 4 + 1] / 255;
        const b = imageData[p * 4 + 2] / 255;
        floatData[p]               = (r - MEAN[0]) / STD[0];
        floatData[p + 224 * 224]   = (g - MEAN[1]) / STD[1];
        floatData[p + 2 * 224*224] = (b - MEAN[2]) / STD[2];
      }

      const tensor = new ort.Tensor("float32", floatData, [1, 3, 224, 224]);
      const result = await session.run({ input: tensor });
      logits.push(result.output.data[0]);
      await new Promise(r => setTimeout(r, 60));
    }

    const avgLogit = logits.reduce((a, b) => a + b, 0) / logits.length;
    const prob     = 1 / (1 + Math.exp(-avgLogit));
    showResult(prob);
  }

  // ── Result ────────────────────────────────────────────────────────────────
  function showResult(prob) {
    phase = "done";
    setStatus("");
    setRing(0);
    const box    = document.getElementById("resultBox");
    const isReal = prob > 0.5;
    box.className  = isReal ? "real" : "attack";
    box.innerText  = isReal
      ? `✓ Real Person  (${(prob * 100).toFixed(1)}%)`
      : `✗ Spoof Detected  (${((1 - prob) * 100).toFixed(1)}% spoof)`;
    box.style.display = "block";
    document.getElementById("retryBtn").style.display = "inline-block";
  }

  function retry() {
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("retryBtn").style.display  = "none";
    phase      = "aligning";
    alignStart = null;
    setRing(0);
    setStatus("Position your face inside the oval");
    requestAnimationFrame(alignLoop);
  }

  function setStatus(msg) {
    document.getElementById("status").innerText = msg;
  }

  init();
</script>
</body>
</html>
