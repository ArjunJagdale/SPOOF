<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Spoof Live</title>

  <!-- ONNX Runtime for spoof model -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <!-- vladmandic/face-api — actively maintained fork, WebGL backend, NO WASM conflict -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { text-align: center; font-family: Arial; overflow-x: hidden; }
  h2 { font-size: 30px; margin: 16px 0 6px; }
  .instructions {
    font-size: 15px; color: #444; max-width: 360px;
    margin: 8px auto 16px; line-height: 1.4; padding: 0 12px;
  }
  .video-wrapper {
    position: relative;
    width: min(400px, calc(100vw - 24px));
    height: min(400px, calc(100vw - 24px));
    margin: 0 auto;
    overflow: hidden;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-wrapper::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(
      ellipse 35% 55% at center,
      transparent 0%, transparent 90%, rgba(0,0,0,0.80) 91%
    );
  }

  /* Distance badge */
  #distanceBadge {
    display: inline-block; margin-top: 10px; padding: 6px 18px;
    border-radius: 999px; font-size: 15px; font-weight: 600;
    letter-spacing: 0.4px; transition: background 0.3s, color 0.3s;
    background: #e8e8e8; color: #333;
  }
  #distanceBadge.close { background: #ffe0e0; color: #c0392b; }
  #distanceBadge.good  { background: #d4f7dc; color: #1a7a37; }
  #distanceBadge.far   { background: #fff3cd; color: #856404; }
</style>
</head>
<body>
<h2>Live Anti-Spoof</h2>
<p class="instructions">
  • Ensure your face is clearly visible in good lighting (avoid harsh reflections).<br>
  • Align and fit your face tightly within the oval.
</p>
<div class="video-wrapper">
  <video id="video" autoplay playsinline></video>
</div>
<canvas id="canvas" width="224" height="224" style="display:none;"></canvas>
<p id="result" style="margin-top:12px;">Loading models...</p>
<div id="distanceBadge">📏 Distance: —</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  DISTANCE CONFIG
//  Pinhole formula: distance_cm = (KNOWN_WIDTH_CM × FOCAL_PX) / face_box_width_px
//
//  FOCAL_PX is calibrated for a 224×224 canvas:
//    Typical face at 60 cm fills ~134 px → focal = 134 × 60 / 14 ≈ 574
//  ⚙️  Sit 60 cm away, check reading, nudge FOCAL_PX until it shows ~60.
// ─────────────────────────────────────────────────────────────────────────────
const KNOWN_FACE_WIDTH_CM = 14;   // average adult face width
const FOCAL_PX            = 574;  // calibrated for 224px canvas at ~60 cm
const GOOD_MIN_CM         = 25;   // green zone min — adjust to your oval
const GOOD_MAX_CM         = 38;   // green zone max — adjust to your oval

// MODEL URL — weights served directly from CDN, nothing to commit to your repo
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model";

let faceApiReady = false;
let latestFaceBoxWidth = null;   // px on 224×224 canvas

// Load only the tiny face detector (smallest, fastest, no landmark weights needed)
async function loadFaceApi() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  faceApiReady = true;
  console.log("✅ TinyFaceDetector loaded");
}

// Detection options — inputSize 160 is fastest for webcam distance estimation
const DETECTOR_OPTS = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.4 });

// Throttle: run detection at ~8 fps (plenty for distance), keep loop light
let lastDetectTime = 0;
async function runFaceDetection(canvas) {
  if (!faceApiReady) return;
  const now = performance.now();
  if (now - lastDetectTime < 120) return;
  lastDetectTime = now;

  // detectSingleFace runs on the canvas element directly (no extra copy needed)
  const det = await faceapi.detectSingleFace(canvas, DETECTOR_OPTS);
  latestFaceBoxWidth = det ? det.box.width : null;
}

function updateDistanceBadge() {
  const badge = document.getElementById("distanceBadge");
  if (!latestFaceBoxWidth) {
    badge.className = "";
    badge.textContent = "📏 Distance: — (no face detected)";
    return;
  }
  const d = Math.round((KNOWN_FACE_WIDTH_CM * FOCAL_PX) / latestFaceBoxWidth);
  if (d < GOOD_MIN_CM) {
    badge.className = "close";
    badge.textContent = `📏 ${d} cm — Too close, move back`;
  } else if (d > GOOD_MAX_CM) {
    badge.className = "far";
    badge.textContent = `📏 ${d} cm — Too far, move closer`;
  } else {
    badge.className = "good";
    badge.textContent = `📏 ${d} cm — ✓ Perfect distance`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  ORIGINAL CODE — untouched below this line
// ─────────────────────────────────────────────────────────────────────────────
let session;
let currentFacingMode = "user";
let isFrontCamera = true;
let currentStream = null;

async function init() {
  // Load both models in parallel — faster startup
  const [_ort] = await Promise.all([
    ort.InferenceSession.create("spoofnet.onnx"),
    loadFaceApi()
  ]);
  session = _ort;
  document.getElementById("result").innerText = "Models loaded. Starting camera...";
  startCamera(currentFacingMode);
}

async function startCamera(facingMode) {
  const video = document.getElementById("video");
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode }
  });
  currentStream = stream;
  video.srcObject = stream;
  currentFacingMode = facingMode;
  isFrontCamera = facingMode === "user";
  video.style.transform = isFrontCamera ? "scaleX(-1)" : "scaleX(1)";
  runLoop();
}

document.addEventListener("dblclick", () => {
  const newMode = currentFacingMode === "user" ? "environment" : "user";
  startCamera(newMode);
});

async function runLoop() {
  const video  = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx    = canvas.getContext("2d");

  ctx.save();
  if (isFrontCamera) {
    ctx.scale(-1, 1);
    ctx.drawImage(video, -224, 0, 224, 224);
  } else {
    ctx.drawImage(video, 0, 0, 224, 224);
  }
  ctx.restore();

  const imageData = ctx.getImageData(0, 0, 224, 224).data;
  const floatData = new Float32Array(1 * 3 * 224 * 224);
  const mean = [0.485, 0.456, 0.406];
  const std  = [0.229, 0.224, 0.225];
  for (let i = 0; i < 224 * 224; i++) {
    const r = imageData[i * 4]     / 255;
    const g = imageData[i * 4 + 1] / 255;
    const b = imageData[i * 4 + 2] / 255;
    floatData[i]             = (r - mean[0]) / std[0];
    floatData[i + 224*224]   = (g - mean[1]) / std[1];
    floatData[i + 2*224*224] = (b - mean[2]) / std[2];
  }

  const tensor  = new ort.Tensor("float32", floatData, [1, 3, 224, 224]);
  const results = await session.run({ input: tensor });
  const logit   = results.output.data[0];
  const prob    = 1 / (1 + Math.exp(-logit));

  document.getElementById("result").innerText =
    prob > 0.5 ? `REAL (${prob.toFixed(3)})`
               : `ATTACK (${prob.toFixed(3)})`;

  // ── Face distance — non-blocking, throttled, runs on the same canvas ──────
  runFaceDetection(canvas);   // fire-and-forget, updates latestFaceBoxWidth
  updateDistanceBadge();

  requestAnimationFrame(runLoop);
}

init();
</script>
</body>
</html>
