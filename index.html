<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Spoof Live</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js"
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      text-align: center;
      font-family: Arial;
      overflow-x: hidden;
    }

    h2 {
      font-size: 30px;
      margin: 16px 0 6px;
    }

    .instructions {
      font-size: 15px;
      color: #444;
      max-width: 360px;
      margin: 8px auto 16px;
      line-height: 1.4;
      padding: 0 12px;
    }

    .video-wrapper {
      position: relative;
      width: min(400px, calc(100vw - 24px));
      height: min(400px, calc(100vw - 24px));
      margin: 0 auto;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse 35% 55% at center,
          transparent 0%,
          transparent 90%,
          rgba(0, 0, 0, 0.80) 91%
        );
    }
  </style>
</head>
<body>

<h2>Live Anti-Spoof</h2>

<p class="instructions">
  • Ensure your face is clearly visible in good lighting (avoid harsh reflections).<br>
  • Align and fit your face tightly within the oval.
</p>

<div class="video-wrapper">
  <video id="video" autoplay playsinline></video>
</div>

<canvas id="canvas" width="224" height="224" style="display:none;"></canvas>
<p id="result" style="margin-top:12px;">Loading models...</p>

<script type="module">
import { FaceDetector, FilesetResolver } from "@mediapipe/tasks-vision";

let session;
let faceDetector;
let currentFacingMode = "user";
let isFrontCamera = true;
let currentStream = null;

// Small buffer to avoid flickering: track consecutive no-face frames
let noFaceFrames = 0;
const NO_FACE_BUFFER = 8; // frames before switching to "No Face Detected"
let faceVisible = false;

const FACE_CONFIDENCE_THRESHOLD = 0.7;

async function init() {
  const resultEl = document.getElementById("result");
  resultEl.innerText = "Loading models...";

  // Load both in parallel
  const [filesetResolver] = await Promise.all([
    FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
    ),
    (async () => {
      session = await ort.InferenceSession.create("spoofnet.onnx");
    })()
  ]);

  faceDetector = await FaceDetector.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    minDetectionConfidence: FACE_CONFIDENCE_THRESHOLD
  });

  resultEl.innerText = "Models loaded. Starting camera...";
  startCamera(currentFacingMode);
}

async function startCamera(facingMode) {
  const video = document.getElementById("video");

  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode }
  });

  currentStream = stream;
  video.srcObject = stream;

  currentFacingMode = facingMode;
  isFrontCamera = facingMode === "user";

  video.style.transform = isFrontCamera ? "scaleX(-1)" : "scaleX(1)";

  // Reset buffer on camera switch
  noFaceFrames = 0;
  faceVisible = false;

  runLoop();
}

// Double tap to switch camera
document.addEventListener("dblclick", () => {
  const newMode = currentFacingMode === "user" ? "environment" : "user";
  startCamera(newMode);
});

async function runLoop() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const resultEl = document.getElementById("result");

  // ── Step 1: Face Detection Gate ─────────────────────────────────────────
  let faceDetected = false;

  if (video.readyState >= 2) {
    try {
      const detections = faceDetector.detectForVideo(video, performance.now());
      faceDetected = detections.detections.length > 0;
    } catch (e) {
      // Silently skip on edge cases (e.g. video not ready)
      faceDetected = false;
    }
  }

  // Buffer logic: avoid flickering
  if (faceDetected) {
    noFaceFrames = 0;
    faceVisible = true;
  } else {
    noFaceFrames++;
    if (noFaceFrames >= NO_FACE_BUFFER) {
      faceVisible = false;
    }
  }

  // ── Step 2: If no face, skip classifier ─────────────────────────────────
  if (!faceVisible) {
    resultEl.innerText = "No Face Detected";
    requestAnimationFrame(runLoop);
    return;
  }

  // ── Step 3: Existing liveness logic (untouched) ─────────────────────────
  ctx.save();

  if (isFrontCamera) {
    ctx.scale(-1, 1);
    ctx.drawImage(video, -224, 0, 224, 224);
  } else {
    ctx.drawImage(video, 0, 0, 224, 224);
  }

  ctx.restore();

  const imageData = ctx.getImageData(0, 0, 224, 224).data;
  const floatData = new Float32Array(1 * 3 * 224 * 224);

  const mean = [0.485, 0.456, 0.406];
  const std  = [0.229, 0.224, 0.225];

  for (let i = 0; i < 224 * 224; i++) {
    const r = imageData[i * 4]     / 255;
    const g = imageData[i * 4 + 1] / 255;
    const b = imageData[i * 4 + 2] / 255;

    floatData[i]             = (r - mean[0]) / std[0];
    floatData[i + 224*224]   = (g - mean[1]) / std[1];
    floatData[i + 2*224*224] = (b - mean[2]) / std[2];
  }

  const tensor = new ort.Tensor("float32", floatData, [1, 3, 224, 224]);
  const results = await session.run({ input: tensor });

  const logit = results.output.data[0];
  const prob = 1 / (1 + Math.exp(-logit));

  resultEl.innerText =
    prob > 0.5 ? `REAL (${prob.toFixed(3)})`
               : `ATTACK (${prob.toFixed(3)})`;

  requestAnimationFrame(runLoop);
}

init();
</script>

</body>
</html>
