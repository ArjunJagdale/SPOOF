<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Spoof Live</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <!-- MediaPipe FaceMesh — all-in-one, no extra model files needed -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    text-align: center;
    font-family: Arial;
    overflow-x: hidden;
  }
  h2 {
    font-size: 30px;
    margin: 16px 0 6px;
  }
  .instructions {
    font-size: 15px;
    color: #444;
    max-width: 360px;
    margin: 8px auto 16px;
    line-height: 1.4;
    padding: 0 12px;
  }
  .video-wrapper {
    position: relative;
    width: min(400px, calc(100vw - 24px));
    height: min(400px, calc(100vw - 24px));
    margin: 0 auto;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .video-wrapper::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(
        ellipse 35% 55% at center,
        transparent 0%,
        transparent 90%,
        rgba(0, 0, 0, 0.80) 91%
      );
  }

  /* ── Distance badge ── */
  #distanceBadge {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.4px;
    transition: background 0.3s, color 0.3s;
    background: #e8e8e8;
    color: #333;
  }
  #distanceBadge.close { background: #ffe0e0; color: #c0392b; }
  #distanceBadge.good  { background: #d4f7dc; color: #1a7a37; }
  #distanceBadge.far   { background: #fff3cd; color: #856404; }
</style>
</head>
<body>
<h2>Live Anti-Spoof</h2>
<p class="instructions">
  • Ensure your face is clearly visible in good lighting (avoid harsh reflections).<br>
  • Align and fit your face tightly within the oval.
</p>
<div class="video-wrapper">
  <video id="video" autoplay playsinline></video>
</div>
<canvas id="canvas" width="224" height="224" style="display:none;"></canvas>
<p id="result" style="margin-top:12px;">Loading model...</p>
<div id="distanceBadge">📏 Distance: —</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  DISTANCE ESTIMATION — MediaPipe FaceMesh
//
//  We measure the pixel distance between left cheek landmark (234) and
//  right cheek landmark (454) — the widest stable points on the face.
//
//  Pinhole camera formula:
//      distance (cm) = (KNOWN_FACE_WIDTH_CM × FOCAL_LENGTH_PX) / face_pixel_width
//
//  Focal length calibrated for a typical webcam (640px wide stream):
//      A ~14 cm wide face at 60 cm ≈ 190 px wide  →  focal = 190×60/14 ≈ 814
//  ⚙️  Tweak FOCAL_LENGTH_PX if readings feel off on your specific camera.
// ─────────────────────────────────────────────────────────────────────────────
const KNOWN_FACE_WIDTH_CM = 14;   // average adult inter-cheek width in cm
const FOCAL_LENGTH_PX     = 814;  // calibrated for a typical 640px-wide webcam

// "Tight oval fit" target range in cm — adjust to match your oval size
const GOOD_MIN_CM = 25;
const GOOD_MAX_CM = 38;

// FaceMesh landmark indices for left & right cheek extremes
const LEFT_CHEEK  = 234;
const RIGHT_CHEEK = 454;

let latestFaceWidthPx = null;   // updated by FaceMesh callback

// ── Initialise MediaPipe FaceMesh ─────────────────────────────────────────
const faceMesh = new FaceMesh({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: false,   // keep it fast — we only need cheek landmarks
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const lm = results.multiFaceLandmarks[0];
    const lc = lm[LEFT_CHEEK];
    const rc = lm[RIGHT_CHEEK];

    // Landmarks are normalised [0–1] — scale by actual video pixel width
    const video = document.getElementById("video");
    const vw    = video.videoWidth || 640;

    const dx = (lc.x - rc.x) * vw;
    const dy = (lc.y - rc.y) * vw;   // vw intentional (keeps aspect-correct)
    latestFaceWidthPx = Math.sqrt(dx * dx + dy * dy);
  } else {
    latestFaceWidthPx = null;
  }
});

// ── Distance badge updater ────────────────────────────────────────────────
function updateDistanceBadge() {
  const badge = document.getElementById("distanceBadge");
  if (!latestFaceWidthPx) {
    badge.className = "";
    badge.textContent = "📏 Distance: — (no face detected)";
    return;
  }
  const distanceCm = (KNOWN_FACE_WIDTH_CM * FOCAL_LENGTH_PX) / latestFaceWidthPx;
  const d = Math.round(distanceCm);
  if (d < GOOD_MIN_CM) {
    badge.className = "close";
    badge.textContent = `📏 ${d} cm — Too close, move back`;
  } else if (d > GOOD_MAX_CM) {
    badge.className = "far";
    badge.textContent = `📏 ${d} cm — Too far, move closer`;
  } else {
    badge.className = "good";
    badge.textContent = `📏 ${d} cm — ✓ Perfect distance`;
  }
}

// ── Feed video frames to FaceMesh (throttled to ~15 fps to stay light) ────
let lastMeshTime = 0;
async function sendToFaceMesh(video) {
  const now = performance.now();
  if (now - lastMeshTime < 66) return;   // ~15 fps cap
  lastMeshTime = now;
  await faceMesh.send({ image: video });
}

// ─────────────────────────────────────────────────────────────────────────────
//  ORIGINAL CODE — untouched below this line
// ─────────────────────────────────────────────────────────────────────────────
let session;
let currentFacingMode = "user";
let isFrontCamera = true;
let currentStream = null;

async function init() {
  session = await ort.InferenceSession.create("spoofnet.onnx");
  document.getElementById("result").innerText = "Model loaded. Starting camera...";
  startCamera(currentFacingMode);
}

async function startCamera(facingMode) {
  const video = document.getElementById("video");
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode }
  });
  currentStream = stream;
  video.srcObject = stream;
  currentFacingMode = facingMode;
  isFrontCamera = facingMode === "user";
  video.style.transform = isFrontCamera ? "scaleX(-1)" : "scaleX(1)";
  runLoop();
}

document.addEventListener("dblclick", () => {
  const newMode = currentFacingMode === "user" ? "environment" : "user";
  startCamera(newMode);
});

async function runLoop() {
  const video  = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx    = canvas.getContext("2d");

  ctx.save();
  if (isFrontCamera) {
    ctx.scale(-1, 1);
    ctx.drawImage(video, -224, 0, 224, 224);
  } else {
    ctx.drawImage(video, 0, 0, 224, 224);
  }
  ctx.restore();

  const imageData = ctx.getImageData(0, 0, 224, 224).data;
  const floatData = new Float32Array(1 * 3 * 224 * 224);
  const mean = [0.485, 0.456, 0.406];
  const std  = [0.229, 0.224, 0.225];
  for (let i = 0; i < 224 * 224; i++) {
    const r = imageData[i * 4]     / 255;
    const g = imageData[i * 4 + 1] / 255;
    const b = imageData[i * 4 + 2] / 255;
    floatData[i]             = (r - mean[0]) / std[0];
    floatData[i + 224*224]   = (g - mean[1]) / std[1];
    floatData[i + 2*224*224] = (b - mean[2]) / std[2];
  }

  const tensor  = new ort.Tensor("float32", floatData, [1, 3, 224, 224]);
  const results = await session.run({ input: tensor });
  const logit   = results.output.data[0];
  const prob    = 1 / (1 + Math.exp(-logit));

  document.getElementById("result").innerText =
    prob > 0.5 ? `REAL (${prob.toFixed(3)})`
               : `ATTACK (${prob.toFixed(3)})`;

  // ── Distance: feed frame to FaceMesh + refresh badge ─────────────────────
  sendToFaceMesh(video);   // async, non-blocking — won't slow down spoof check
  updateDistanceBadge();

  requestAnimationFrame(runLoop);
}

init();
</script>
</body>
</html>
