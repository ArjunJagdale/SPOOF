<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Spoof Live</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    text-align: center;
    font-family: Arial;
    overflow-x: hidden;
  }
  h2 {
    font-size: 30px;
    margin: 16px 0 6px;
  }
  .instructions {
    font-size: 15px;
    color: #444;
    max-width: 360px;
    margin: 8px auto 16px;
    line-height: 1.4;
    padding: 0 12px;
  }
  .video-wrapper {
    position: relative;
    width: min(400px, calc(100vw - 24px));
    height: min(400px, calc(100vw - 24px));
    margin: 0 auto;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .video-wrapper::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(
        ellipse 35% 55% at center,
        transparent 0%,
        transparent 90%,
        rgba(0, 0, 0, 0.80) 91%
      );
  }

  /* ── Distance badge ── */
  #distanceBadge {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.4px;
    transition: background 0.3s, color 0.3s;
    background: #e8e8e8;
    color: #333;
  }
  #distanceBadge.close   { background: #ffe0e0; color: #c0392b; }
  #distanceBadge.good    { background: #d4f7dc; color: #1a7a37; }
  #distanceBadge.far     { background: #fff3cd; color: #856404; }
</style>
</head>
<body>
<h2>Live Anti-Spoof</h2>
<p class="instructions">
  • Ensure your face is clearly visible in good lighting (avoid harsh reflections).<br>
  • Align and fit your face tightly within the oval.
</p>
<div class="video-wrapper">
  <video id="video" autoplay playsinline></video>
</div>
<canvas id="canvas" width="224" height="224" style="display:none;"></canvas>

<!-- hidden full-res canvas used only for FaceDetector -->
<canvas id="detCanvas" style="display:none;"></canvas>

<p id="result" style="margin-top:12px;">Loading model...</p>
<div id="distanceBadge">📏 Distance: —</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  DISTANCE ESTIMATION CONFIG
//
//  We use the browser FaceDetector API (Chrome / Android WebView) when available.
//  The pinhole-camera formula:
//
//      distance (cm) = (KNOWN_FACE_WIDTH_CM × FOCAL_LENGTH_PX) / face_pixel_width
//
//  FOCAL_LENGTH_PX is calibrated once: it equals the pixel width that a face
//  appears at when it is exactly CALIB_DISTANCE_CM from the lens.
//  A typical webcam at 60 cm shows an average face (~14 cm wide) at ~190 px
//  in a 640-wide stream → focal ≈ 190 × 60 / 14 ≈ 814 px.
//  You can tweak FOCAL_LENGTH_PX if your camera/setup differs.
// ─────────────────────────────────────────────────────────────────────────────
const KNOWN_FACE_WIDTH_CM = 14;   // average adult inter-ear width
const FOCAL_LENGTH_PX     = 814;  // calibrated for a typical webcam at ~60 cm

// "Tight oval fit" target range in cm  (tweak to match your oval size)
const GOOD_MIN_CM = 25;
const GOOD_MAX_CM = 38;

let faceDetector = null;
let detectorReady = false;

// Initialise FaceDetector if the browser supports it
if (window.FaceDetector) {
  faceDetector = new FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
  detectorReady = true;
  console.log("✅ FaceDetector API available");
} else {
  console.warn("⚠️ FaceDetector API not available – distance estimation disabled");
}

// ── Full-resolution detection canvas (matches actual video stream size) ──────
const detCanvas = document.getElementById("detCanvas");
const detCtx    = detCanvas.getContext("2d");

// Run face detection on the live video frame; returns face width in px or null
async function getFaceWidthPx(video) {
  if (!detectorReady) return null;
  // Size detection canvas to actual stream resolution for accuracy
  const vw = video.videoWidth  || 640;
  const vh = video.videoHeight || 480;
  detCanvas.width  = vw;
  detCanvas.height = vh;
  // Draw un-flipped frame (FaceDetector handles orientation internally)
  detCtx.drawImage(video, 0, 0, vw, vh);
  try {
    const faces = await faceDetector.detect(detCanvas);
    if (!faces.length) return null;
    return faces[0].boundingBox.width;   // px in stream-resolution space
  } catch { return null; }
}

// Convert face pixel width → centimetres from camera
function estimateDistance(faceWidthPx) {
  if (!faceWidthPx || faceWidthPx <= 0) return null;
  return (KNOWN_FACE_WIDTH_CM * FOCAL_LENGTH_PX) / faceWidthPx;
}

// Update the distance badge UI
function updateDistanceBadge(distanceCm) {
  const badge = document.getElementById("distanceBadge");
  if (distanceCm === null) {
    badge.className = "";
    badge.textContent = "📏 Distance: — (no face detected)";
    return;
  }
  const d = Math.round(distanceCm);
  let label, cls;
  if (d < GOOD_MIN_CM) {
    cls = "close";
    label = `📏 ${d} cm — Too close, move back`;
  } else if (d > GOOD_MAX_CM) {
    cls = "far";
    label = `📏 ${d} cm — Too far, move closer`;
  } else {
    cls = "good";
    label = `📏 ${d} cm — ✓ Perfect distance`;
  }
  badge.className = cls;
  badge.textContent = label;
}

// ─────────────────────────────────────────────────────────────────────────────
//  ORIGINAL CODE — untouched below this line
// ─────────────────────────────────────────────────────────────────────────────
let session;
let currentFacingMode = "user";
let isFrontCamera = true;
let currentStream = null;

async function init() {
  session = await ort.InferenceSession.create("spoofnet.onnx");
  document.getElementById("result").innerText = "Model loaded. Starting camera...";
  startCamera(currentFacingMode);
}

async function startCamera(facingMode) {
  const video = document.getElementById("video");
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode }
  });
  currentStream = stream;
  video.srcObject = stream;
  currentFacingMode = facingMode;
  isFrontCamera = facingMode === "user";
  video.style.transform = isFrontCamera ? "scaleX(-1)" : "scaleX(1)";
  runLoop();
}

document.addEventListener("dblclick", () => {
  const newMode = currentFacingMode === "user" ? "environment" : "user";
  startCamera(newMode);
});

async function runLoop() {
  const video  = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx    = canvas.getContext("2d");

  ctx.save();
  if (isFrontCamera) {
    ctx.scale(-1, 1);
    ctx.drawImage(video, -224, 0, 224, 224);
  } else {
    ctx.drawImage(video, 0, 0, 224, 224);
  }
  ctx.restore();

  const imageData = ctx.getImageData(0, 0, 224, 224).data;
  const floatData = new Float32Array(1 * 3 * 224 * 224);
  const mean = [0.485, 0.456, 0.406];
  const std  = [0.229, 0.224, 0.225];
  for (let i = 0; i < 224 * 224; i++) {
    const r = imageData[i * 4]     / 255;
    const g = imageData[i * 4 + 1] / 255;
    const b = imageData[i * 4 + 2] / 255;
    floatData[i]             = (r - mean[0]) / std[0];
    floatData[i + 224*224]   = (g - mean[1]) / std[1];
    floatData[i + 2*224*224] = (b - mean[2]) / std[2];
  }

  const tensor  = new ort.Tensor("float32", floatData, [1, 3, 224, 224]);
  const results = await session.run({ input: tensor });
  const logit   = results.output.data[0];
  const prob    = 1 / (1 + Math.exp(-logit));

  document.getElementById("result").innerText =
    prob > 0.5 ? `REAL (${prob.toFixed(3)})`
               : `ATTACK (${prob.toFixed(3)})`;

  // ── Distance estimation (runs alongside, does not block spoof check) ──────
  getFaceWidthPx(video).then(faceWidthPx => {
    const distanceCm = estimateDistance(faceWidthPx);
    updateDistanceBadge(distanceCm);
  });

  requestAnimationFrame(runLoop);
}

init();
</script>
</body>
</html>
