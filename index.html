<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Spoof Live</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      text-align: center;
      font-family: Arial;
      overflow-x: hidden;
      background: #fff;
    }

    h2 {
      font-size: 26px;
      margin: 16px 0 6px;
    }

    /* ── Video wrapper ── */
    .video-wrapper {
      position: relative;
      width: min(340px, calc(100vw - 24px));
      height: min(340px, calc(100vw - 24px));
      margin: 12px auto 0;
      overflow: hidden;
      border-radius: 50%;           /* circle crop for clean oval feel */
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dark vignette — oval cutout */
    .video-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 38% 50% at center,
        transparent 0%,
        transparent 88%,
        rgba(0,0,0,0.75) 89%
      );
      border-radius: 50%;
    }

    /* ── Progress ring (SVG overlay) ── */
    .ring-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #progressRing {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);   /* start from top */
    }

    #ringTrack {
      fill: none;
      stroke: #ddd;
      stroke-width: 4;
    }

    #ringFill {
      fill: none;
      stroke: #22c55e;             /* green */
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 0 1000;   /* set by JS */
      transition: stroke-dasharray 0.1s linear;
    }

    /* ── Status label under video ── */
    #status {
      margin: 14px auto 0;
      font-size: 15px;
      color: #444;
      min-height: 22px;
    }

    /* ── Result box ── */
    #resultBox {
      display: none;
      margin: 16px auto;
      width: min(340px, calc(100vw - 24px));
      padding: 16px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    #resultBox.real   { background: #dcfce7; color: #15803d; border: 2px solid #86efac; }
    #resultBox.attack { background: #fee2e2; color: #b91c1c; border: 2px solid #fca5a5; }

    /* ── Retry button ── */
    #retryBtn {
      display: none;
      margin: 8px auto 20px;
      padding: 10px 28px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
    }

    #retryBtn:hover { background: #2563eb; }
  </style>
</head>
<body>

<h2>Face Liveness Check</h2>

<div class="video-wrapper" id="videoWrapper">
  <video id="video" autoplay playsinline></video>
  <div class="ring-wrap">
    <svg id="progressRing" viewBox="0 0 200 200">
      <circle id="ringTrack" cx="100" cy="100" r="96"/>
      <circle id="ringFill"  cx="100" cy="100" r="96"/>
    </svg>
  </div>
</div>

<p id="status">Loading models...</p>
<div id="resultBox"></div>
<button id="retryBtn" onclick="retry()">Try Again</button>

<!-- hidden canvas for frame capture -->
<canvas id="canvas" width="224" height="224" style="display:none;"></canvas>

<script>
  // ── Config ───────────────────────────────────────────────────────────────
  const WEIGHTS_URL       = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";
  const DETECTOR_OPTIONS  = new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5 });
  const HOLD_DURATION_MS  = 1500;   // how long face must stay in oval
  const CAPTURE_FRAMES    = 15;     // frames to grab on capture
  const OVAL_IOU_THRESH   = 0.28;   // minimum IoU to count as "filling oval"
  const MEAN              = [0.485, 0.456, 0.406];
  const STD               = [0.229, 0.224, 0.225];

  // Oval bounding rect as fractions (matches CSS ellipse 38% 50%)
  const OVAL = { x1: 0.12, y1: 0.0, x2: 0.88, y2: 1.0 };

  // ── State ────────────────────────────────────────────────────────────────
  let session, currentStream;
  let isFrontCamera     = true;
  let currentFacingMode = "user";
  let alignStart        = null;   // timestamp when face first aligned
  let phase             = "aligning"; // aligning | capturing | done
  let loopRunning       = false;

  // ── Ring circumference ───────────────────────────────────────────────────
  const r           = 96;
  const circumference = 2 * Math.PI * r;
  const ringFill    = document.getElementById("ringFill");

  function setRing(fraction) {
    const filled = fraction * circumference;
    ringFill.style.strokeDasharray = `${filled} ${circumference}`;
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  async function init() {
    setStatus("Loading models...");
    await Promise.all([
      ort.InferenceSession.create("spoofnet.onnx").then(s => { session = s; }),
      faceapi.nets.tinyFaceDetector.loadFromUri(WEIGHTS_URL)
    ]);
    setStatus("Starting camera...");
    await startCamera("user");
  }

  async function startCamera(facingMode) {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
    const video  = document.getElementById("video");
    currentStream     = stream;
    video.srcObject   = stream;
    currentFacingMode = facingMode;
    isFrontCamera     = facingMode === "user";
    video.style.transform = isFrontCamera ? "scaleX(-1)" : "scaleX(1)";
    phase      = "aligning";
    alignStart = null;
    setRing(0);
    loopRunning = false;
    requestAnimationFrame(alignLoop);
  }

  // Double-tap to flip camera
  document.addEventListener("dblclick", () => {
    if (phase === "done") return;
    startCamera(currentFacingMode === "user" ? "environment" : "user");
  });

  // ── IoU helper ───────────────────────────────────────────────────────────
  function computeIoU(box, vw, vh) {
    const fx1 = box.x / vw,          fy1 = box.y / vh;
    const fx2 = (box.x + box.width) / vw, fy2 = (box.y + box.height) / vh;
    const ix1 = Math.max(fx1, OVAL.x1), iy1 = Math.max(fy1, OVAL.y1);
    const ix2 = Math.min(fx2, OVAL.x2), iy2 = Math.min(fy2, OVAL.y2);
    const iw  = Math.max(0, ix2 - ix1), ih = Math.max(0, iy2 - iy1);
    const inter = iw * ih;
    const union = (fx2-fx1)*(fy2-fy1) + (OVAL.x2-OVAL.x1)*(OVAL.y2-OVAL.y1) - inter;
    return union > 0 ? inter / union : 0;
  }

  // ── Alignment loop (lightweight — face-api only, no ONNX) ────────────────
  async function alignLoop() {
    if (phase !== "aligning") return;

    const video = document.getElementById("video");

    let aligned = false;
    if (video.readyState >= 2) {
      const det = await faceapi.detectSingleFace(video, DETECTOR_OPTIONS);
      if (det) {
        const vw  = video.videoWidth  || video.clientWidth;
        const vh  = video.videoHeight || video.clientHeight;
        const iou = computeIoU(det.box, vw, vh);
        aligned   = iou >= OVAL_IOU_THRESH;
      }
    }

    const now = performance.now();

    if (aligned) {
      if (!alignStart) alignStart = now;
      const elapsed  = now - alignStart;
      const fraction = Math.min(elapsed / HOLD_DURATION_MS, 1.0);
      setRing(fraction);
      setStatus("Hold still...");

      if (elapsed >= HOLD_DURATION_MS) {
        phase = "capturing";
        setStatus("Analysing...");
        setRing(1);
        await capture();
        return;
      }
    } else {
      alignStart = null;
      setRing(0);
      setStatus("Fit your face tightly into the oval");
    }

    requestAnimationFrame(alignLoop);
  }

  // ── Capture: grab CAPTURE_FRAMES frames, run ONNX on each, average ───────
  async function capture() {
    const video  = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx    = canvas.getContext("2d");
    const logits = [];

    for (let i = 0; i < CAPTURE_FRAMES; i++) {
      // Draw frame
      ctx.save();
      if (isFrontCamera) {
        ctx.scale(-1, 1);
        ctx.drawImage(video, -224, 0, 224, 224);
      } else {
        ctx.drawImage(video, 0, 0, 224, 224);
      }
      ctx.restore();

      // Preprocess — identical to training test_transform
      const imageData = ctx.getImageData(0, 0, 224, 224).data;
      const floatData = new Float32Array(3 * 224 * 224);
      for (let p = 0; p < 224 * 224; p++) {
        const r = imageData[p * 4]     / 255;
        const g = imageData[p * 4 + 1] / 255;
        const b = imageData[p * 4 + 2] / 255;
        floatData[p]               = (r - MEAN[0]) / STD[0];
        floatData[p + 224 * 224]   = (g - MEAN[1]) / STD[1];
        floatData[p + 2 * 224*224] = (b - MEAN[2]) / STD[2];
      }

      const tensor  = new ort.Tensor("float32", floatData, [1, 3, 224, 224]);
      const result  = await session.run({ input: tensor });
      logits.push(result.output.data[0]);

      // Small gap between frames so we get genuinely different frames
      await new Promise(r => setTimeout(r, 60));
    }

    // Average logits → single sigmoid
    const avgLogit = logits.reduce((a, b) => a + b, 0) / logits.length;
    const prob     = 1 / (1 + Math.exp(-avgLogit));

    showResult(prob);
  }

  // ── Show result ───────────────────────────────────────────────────────────
  function showResult(prob) {
    phase = "done";
    setStatus("");
    setRing(0);

    const box    = document.getElementById("resultBox");
    const isReal = prob > 0.5;

    box.className   = isReal ? "real" : "attack";
    box.innerText   = isReal
      ? `✓ Real Person  (${(prob * 100).toFixed(1)}%)`
      : `✗ Spoof Detected  (${((1 - prob) * 100).toFixed(1)}% spoof)`;
    box.style.display = "block";

    document.getElementById("retryBtn").style.display = "inline-block";
  }

  // ── Retry ─────────────────────────────────────────────────────────────────
  function retry() {
    document.getElementById("resultBox").style.display  = "none";
    document.getElementById("retryBtn").style.display   = "none";
    phase      = "aligning";
    alignStart = null;
    setRing(0);
    setStatus("Fit your face tightly into the oval");
    requestAnimationFrame(alignLoop);
  }

  function setStatus(msg) {
    document.getElementById("status").innerText = msg;
  }

  init();
</script>
</body>
</html>
