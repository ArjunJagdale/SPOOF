<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpoofNet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0e0e0e;
    color: #ccc;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    gap: 16px;
  }

  #cam-wrap {
    position: relative;
    width: 400px;
    height: 400px;
  }
  video {
    display: block;
    width: 400px;
    height: 400px;
    object-fit: cover;
    background: #000;
  }
  canvas#overlay {
    position: absolute;
    inset: 0;
    width: 400px;
    height: 400px;
    pointer-events: none;
  }
  canvas#proc { display: none; }

  #instruction { font-size: 0.8rem; color: #f0b800; }
  #score       { font-size: 1.4rem; font-weight: bold; min-height: 1.6em; }
  #score.real   { color: #00e87a; }
  #score.attack { color: #ff3d5a; }
  #status      { font-size: 0.7rem; color: #555; }

  button {
    width: 400px;
    background: #0e0e0e;
    border: 1px solid #00e87a;
    color: #00e87a;
    font-family: monospace;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    padding: 10px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #0a1f14; }
  button:disabled { border-color: #333; color: #333; cursor: not-allowed; }

  #frames-section { display: none; width: 400px; }
  #frames-label   { font-size: 0.65rem; color: #444; margin-bottom: 6px; }
  #frames-grid    { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  #frames-grid img {
    width: 100%; aspect-ratio: 1;
    image-rendering: pixelated;
    border: 1px solid #1a1a1a;
    cursor: pointer;
    display: block;
  }
  #frames-grid img.real   { border-color: #0d3320; }
  #frames-grid img.attack { border-color: #3a0d15; }
  #frames-grid img:hover  { border-color: #555; }

  #lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 8px;
    z-index: 999; cursor: pointer;
  }
  #lightbox.on { display: flex; }
  #lightbox img { image-rendering: pixelated; width: 224px; height: 224px; }
  #lightbox span { font-size: 0.65rem; color: #555; font-family: monospace; }
</style>
</head>
<body>

<div id="cam-wrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>
<canvas id="proc" width="224" height="224"></canvas>

<div id="instruction">Loading model…</div>
<div id="score"></div>
<div id="status"></div>
<button id="start-btn" disabled>▶ START CAPTURE</button>

<div id="frames-section">
  <div id="frames-label">last scan — fed to model (click to enlarge)</div>
  <div id="frames-grid"></div>
</div>

<div id="lightbox">
  <img id="lb-img" src="">
  <span id="lb-label"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
const MEAN = [0.485, 0.456, 0.406];
const STD  = [0.229, 0.224, 0.225];

const EXPAND_TOP    = 0.00;
const EXPAND_BOTTOM = 0.00;
const EXPAND_LEFT   = 0.00;
const EXPAND_RIGHT  = 0.00;

const BUFFER_SIZE    = 35;
const REAL_THRESHOLD = 0.80;

const video    = document.getElementById('video');
const overlay  = document.getElementById('overlay');
const octx     = overlay.getContext('2d');
const proc     = document.getElementById('proc');
const pctx     = proc.getContext('2d');
const instrEl  = document.getElementById('instruction');
const scoreEl  = document.getElementById('score');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start-btn');
const framesSection = document.getElementById('frames-section');
const framesGrid    = document.getElementById('frames-grid');
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lb-img');
const lbLabel  = document.getElementById('lb-label');

let session = null, capturing = false, scanning = false;
let frameBuffer = [], jpegBuffer = [];

lightbox.addEventListener('click', () => lightbox.classList.remove('on'));

async function main() {
  instrEl.textContent = 'Loading SpoofNet…';
  ort.env.wasm.numThreads = navigator.hardwareConcurrency || 4;
  session = await ort.InferenceSession.create('./spoofnet.onnx', { executionProviders: ['wasm'] });

  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 640, facingMode: 'user' } });
  video.srcObject = stream;
  await video.play();
  overlay.width  = video.videoWidth  || 640;
  overlay.height = video.videoHeight || 640;

  const fd = new FaceDetection({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4/${f}` });
  fd.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
  fd.onResults(onResults);
  async function loop() { await fd.send({ image: video }); requestAnimationFrame(loop); }
  loop();

  instrEl.textContent = 'Ready. Press Start Capture and look at camera.';
  startBtn.disabled = false;
}

function resetCapture(msg) {
  frameBuffer = []; jpegBuffer = [];
  instrEl.textContent  = msg;
  statusEl.textContent = 'Restarting…';
}

startBtn.addEventListener('click', () => {
  capturing = true; scanning = false;
  frameBuffer = []; jpegBuffer = [];
  startBtn.disabled    = true;
  scoreEl.textContent  = ''; scoreEl.className = '';
  instrEl.textContent  = '👤 Stay still, face centred…';
  statusEl.textContent = `0 / ${BUFFER_SIZE}`;
  framesSection.style.display = 'none';
  framesGrid.innerHTML = '';
});

function onResults(results) {
  const W = overlay.width, H = overlay.height;
  octx.clearRect(0, 0, W, H);

  if (!results.detections || !results.detections.length) {
    if (capturing && !scanning) resetCapture('⚠ Face lost — restarting…');
    return;
  }

  const bb = results.detections[0].boundingBox;
  const rx = (bb.xCenter - bb.width  / 2) * W;
  const ry = (bb.yCenter - bb.height / 2) * H;
  const rw = bb.width * W, rh = bb.height * H;

  const x1 = Math.max(0, rx - EXPAND_LEFT   * rw);
  const y1 = Math.max(0, ry - EXPAND_TOP    * rh);
  const x2 = Math.min(W, rx + rw + EXPAND_RIGHT  * rw);
  const y2 = Math.min(H, ry + rh + EXPAND_BOTTOM * rh);

  const sx = 400 / W, sy = 400 / H;
  octx.strokeStyle = scanning ? '#f0b800' : '#00e87a';
  octx.lineWidth = 1.5;
  octx.strokeRect(x1*sx, y1*sy, (x2-x1)*sx, (y2-y1)*sy);

  if (!capturing || scanning) return;

  pctx.drawImage(video, x1, y1, x2-x1, y2-y1, 0, 0, 224, 224);
  const { data } = pctx.getImageData(0, 0, 224, 224);
  frameBuffer.push(toFloat32(data));
  jpegBuffer.push(proc.toDataURL('image/jpeg', 0.95));
  statusEl.textContent = `${frameBuffer.length} / ${BUFFER_SIZE}`;

  if (frameBuffer.length >= BUFFER_SIZE) { scanning = true; runInference(); }
}

async function runInference() {
  instrEl.textContent  = '⏳ Analysing…';
  statusEl.textContent = `Running ${BUFFER_SIZE} frames…`;

  const probs = [], times = [];
  for (const f of frameBuffer) {
    const tensor = new ort.Tensor('float32', f, [1, 3, 224, 224]);
    const t0  = performance.now();
    const out = await session.run({ [session.inputNames[0]]: tensor });
    times.push(performance.now() - t0);
    probs.push(1 / (1 + Math.exp(-out[session.outputNames[0]].data[0])));
  }
  const avgMs = (times.reduce((a,b) => a+b, 0) / times.length).toFixed(1);
  const minMs = Math.min(...times).toFixed(1);
  const maxMs = Math.max(...times).toFixed(1);

  const avg    = probs.reduce((a, b) => a + b, 0) / probs.length;
  const pct    = (avg * 100).toFixed(1);
  const isReal = avg >= REAL_THRESHOLD;
  const label  = isReal ? 'real' : 'attack';

  scoreEl.textContent = isReal ? `✓ REAL` : `✗ ATTACK`;
  scoreEl.className   = isReal ? 'real' : 'attack';
  instrEl.textContent = 'Done. Press Start Capture to scan again.';
  statusEl.textContent = `avg ${pct}% · ${BUFFER_SIZE} frames · inference ${avgMs}ms/frame (min ${minMs} max ${maxMs})`;

  framesGrid.innerHTML = '';
  jpegBuffer.forEach((url, i) => {
    const probPct = (probs[i] * 100).toFixed(1);
    const img = document.createElement('img');
    img.src = url; img.title = `frame ${i+1} · ${probPct}%`;
    img.className = probs[i] >= REAL_THRESHOLD ? 'real' : 'attack';
    img.addEventListener('click', () => {
      lbImg.src = url;
      lbLabel.textContent = `frame ${i+1}  ·  ${probPct}%  ·  ${label}`;
      lightbox.classList.add('on');
    });
    framesGrid.appendChild(img);
  });
  framesSection.style.display = 'block';

  capturing = false; scanning = false;
  frameBuffer = []; jpegBuffer = [];
  startBtn.disabled = false;
}

function toFloat32(data) {
  const N = 224 * 224, f = new Float32Array(3 * N);
  for (let i = 0; i < N; i++) {
    f[0*N+i] = (data[i*4  ]/255 - MEAN[0]) / STD[0];
    f[1*N+i] = (data[i*4+1]/255 - MEAN[1]) / STD[1];
    f[2*N+i] = (data[i*4+2]/255 - MEAN[2]) / STD[2];
  }
  return f;
}

main().catch(e => { instrEl.textContent = '✗ ' + e.message; });
</script>
</body>
</html>
